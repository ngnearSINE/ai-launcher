# Pushing a tag v1.2.3 builds the Windows installer and the Ubuntu deb/AppImage, signs the updater
# artifacts and publishes them with latest.json to GitHub Releases. Installed launchers read
# releases/latest/download/latest.json to update themselves.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Versions match the tag
        run: |
          v="${{ steps.tag.outputs.tag }}"; v="${v#v}"
          conf=$(jq -r .version app/tauri.conf.json)
          ui=$(jq -r .version ui/package.json)
          cargo=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag=$v tauri=$conf ui=$ui cargo=$cargo"
          [ "$v" = "$conf" ] && [ "$v" = "$ui" ] && [ "$v" = "$cargo" ] || { echo "::error::version mismatch"; exit 1; }

      - name: Release notes from CHANGELOG
        run: |
          v="${{ steps.tag.outputs.tag }}"; v="${v#v}"
          section() { awk -v h="## $v" '$0==h{f=1;next} /^## /{f=0} f' "$1" 2>/dev/null; }
          {
            section CHANGELOG.md
            en=$(section CHANGELOG.en.md)
            if [ -n "$en" ]; then printf '\n## English\n%s\n' "$en"; fi
            printf '\n'; sed "s/{version}/$v/g" docs/release-install.md 2>/dev/null
          } > notes.md
          cat notes.md

      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The id comes from the create response: listing releases right after creating a draft
        # can miss it, and without an id tauri-action silently skips every upload.
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          repo="${{ github.repository }}"
          # A rebuilt draft can come back as "untagged-…", so it is also found by its name and
          # given its tag again.
          id=$(gh api "repos/$repo/releases?per_page=100" --jq ".[] | select(.tag_name==\"$tag\" or (.draft and .name==\"AI Launcher $tag\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$repo/releases/$id" -f tag_name="$tag" -F body=@notes.md >/dev/null
          else
            id=$(gh api -X POST "repos/$repo/releases" -f tag_name="$tag" -f name="AI Launcher $tag" -F draft=true -F body=@notes.md --jq .id)
          fi
          [ -n "$id" ] || { echo "::error::no release id for $tag"; exit 1; }
          echo "release id $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        # Each platform uploads its installers and signatures; the publish job then writes one
        # latest.json for all of them, so installed copies on x64 and arm64 both find their
        # update. Windows arm64 is cross-compiled on the x64 runner.
        include:
          - os: windows-latest
            arch: x64
            target: ''
            args: --bundles nsis
          - os: windows-latest
            arch: arm64
            target: aarch64-pc-windows-msvc
            args: --bundles nsis --target aarch64-pc-windows-msvc
          - os: ubuntu-22.04
            arch: x64
            target: ''
            args: --bundles deb,appimage
          - os: ubuntu-22.04-arm
            arch: arm64
            target: ''
            args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: npx --prefix ../ui tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Parallel jobs rewriting one latest.json race ("Not Found" on update, a platform
          # missing); the publish job writes it once instead.
          includeUpdaterJson: false
          args: ${{ matrix.args }} --config tauri.release.conf.json

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      # The script comes from the ref the workflow runs from, so an older tag can be rebuilt.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: latest.json from the signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${{ github.repository }}"
          id="${{ needs.create-release.outputs.release_id }}"
          tag="${{ needs.create-release.outputs.tag }}"
          mkdir sigs
          gh api "repos/$repo/releases/$id" --jq '.assets[] | select(.name|endswith(".sig")) | "\(.id) \(.name)"' |
            while read -r aid name; do
              gh api -H 'Accept: application/octet-stream' "repos/$repo/releases/assets/$aid" > "sigs/$name"
            done
          python3 -I .github/scripts/latest_json.py "${tag#v}" sigs "$repo" > latest.json
          cat latest.json
          old=$(gh api "repos/$repo/releases/$id" --jq '.assets[] | select(.name=="latest.json") | .id')
          if [ -n "$old" ]; then gh api -X DELETE "repos/$repo/releases/assets/$old"; fi
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @latest.json "https://uploads.github.com/repos/$repo/releases/$id/assets?name=latest.json" >/dev/null

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id="${{ needs.create-release.outputs.release_id }}"
          tag="${{ needs.create-release.outputs.tag }}"
          names=$(gh api "repos/${{ github.repository }}/releases/$id" --jq '.assets[].name')
          echo "$names"
          for want in 'latest.json' '_x64-setup.exe' '_arm64-setup.exe' '_amd64.AppImage' '_aarch64.AppImage' '_amd64.deb' '_arm64.deb'; do
            echo "$names" | grep -Fq -- "$want" || { echo "::error::missing $want, not publishing"; exit 1; }
          done
          gh api -X PATCH "repos/${{ github.repository }}/releases/$id" -f tag_name="$tag" -F draft=false -f make_latest=true >/dev/null
