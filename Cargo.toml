[workspace]
resolver = "2"
members = ["crates/core", "crates/usage", "crates/platform", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ngnearSINE/ai-launcher"
authors = ["Leonard"]

[workspace.dependencies]
launcher-core = { path = "crates/core" }
launcher-usage = { path = "crates/usage" }
launcher-platform = { path = "crates/platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
log = "0.4"
base64 = "0.22"
dirs = "6"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
